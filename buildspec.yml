version: 0.2

env:
  variables:
    PACKER_VERSION: "1.14.3"

phases:
  install:
    commands:
      - echo "Installing tools required by Packer..."
      - apt-get update
      - apt-get install -y curl unzip
      - curl -fsSLo /tmp/packer.zip "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip"
      - unzip -o /tmp/packer.zip -d /usr/local/bin
      - packer version

  pre_build:
    commands:
      - echo "Validating Packer template..."
      - packer init .
      - packer fmt -check .
      - packer validate -var "aws_region=${AWS_DEFAULT_REGION}" .

  build:
    commands:
      - echo "Building the E-commerce Golden AMI in ${AWS_DEFAULT_REGION}..."
      - packer build -var "aws_region=${AWS_DEFAULT_REGION}" .

  post_build:
    commands:
      - echo "Packer build stage finished."
      - test -s manifest.json
      - cat manifest.json
  
artifacts:
  files:
    - manifest.json
    - ecommerce-golden.pkr.hcl
  discard-paths: yes
